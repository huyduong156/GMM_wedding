name: Deploy frontend to cPanel

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy frontend static bundle
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_FRONTEND_PATH: ${{ secrets.CPANEL_FRONTEND_PATH }}
      CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
      CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Detect pending frontend changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          port="${CPANEL_SSH_PORT:-22}"
          printf -v marker_q '%q' "${CPANEL_FRONTEND_PATH}/.deploy-state/frontend.sha"
          last_sha="$(ssh -T -p "$port" -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o ConnectTimeout=30 \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "if [ -s ${marker_q} ]; then cat ${marker_q}; fi")"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            changed=true
            reason="manual dispatch"
          elif [[ -z "$last_sha" ]] || ! git cat-file -e "${last_sha}^{commit}" 2>/dev/null; then
            changed=true
            reason="no valid deployed frontend marker"
          elif ! git merge-base --is-ancestor "$last_sha" "$TARGET_SHA"; then
            changed=true
            reason="deployed marker is not an ancestor of target"
          elif git diff --name-only "$last_sha" "$TARGET_SHA" | grep -qE '^(frontend/|\.github/workflows/deploy-frontend-cpanel\.yml)'; then
            changed=true
            reason="frontend changes pending"
          else
            changed=false
            reason="no frontend changes since last successful deploy"
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Frontend deploy decision: $changed ($reason)"

      - name: Setup Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.changed == 'true'
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        if: steps.changes.outputs.changed == 'true'
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.ourday.asia/api
        run: npm run build

      - name: Package frontend bundle
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/gmm-wedding-frontend"
          archive="$RUNNER_TEMP/gmm-wedding-frontend-${TARGET_SHA}.tar.gz"

          rm -rf "$bundle_dir" "$archive"
          mkdir -p "$bundle_dir"
          cp -a frontend/dist/. "$bundle_dir/"
          tar -C "$bundle_dir" -czf "$archive" .
          echo "BUNDLE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload and activate frontend over one SSH session
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          port="${CPANEL_SSH_PORT:-22}"
          archive="/tmp/gmm-wedding-frontend-${TARGET_SHA}.tar.gz"
          staging="${CPANEL_FRONTEND_PATH}/.deploy-${TARGET_SHA}"
          printf -v deploy_path_q '%q' "$CPANEL_FRONTEND_PATH"
          printf -v archive_q '%q' "$archive"
          printf -v staging_q '%q' "$staging"
          printf -v marker_q '%q' "${CPANEL_FRONTEND_PATH}/.deploy-state/frontend.sha"
          printf -v target_sha_q '%q' "$TARGET_SHA"

          remote_command="set -e; cleanup(){ rm -rf ${staging_q} ${archive_q}; }; trap cleanup EXIT; cat > ${archive_q}; mkdir -p ${deploy_path_q}; find ${deploy_path_q} -mindepth 1 -maxdepth 1 ! -name .well-known ! -name .deploy-state -exec rm -rf -- {} +; mkdir -p ${staging_q}; tar -xzf ${archive_q} -C ${staging_q}; find ${staging_q} -mindepth 1 -maxdepth 1 -exec mv -- {} ${deploy_path_q}/ \;; mkdir -p ${deploy_path_q}/.deploy-state; printf '%s\\n' ${target_sha_q} > ${marker_q}"

          ssh -T -p "$port" -i "$HOME/.ssh/deploy_key" \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "$remote_command" < "$BUNDLE_ARCHIVE"
