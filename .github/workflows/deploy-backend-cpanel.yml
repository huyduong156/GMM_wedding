name: Deploy backend to cPanel

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy backend standalone bundle
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}
      CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
      CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect backend changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD | grep -qE '^(backend/|\.github/workflows/deploy-backend-cpanel\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        if: steps.changes.outputs.changed == 'true'
        working-directory: backend
        run: npm ci

      - name: Build backend standalone bundle
        if: steps.changes.outputs.changed == 'true'
        working-directory: backend
        run: npm run build

      - name: Package standalone bundle
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/gmm-wedding-backend"
          archive="$RUNNER_TEMP/gmm-wedding-backend-${GITHUB_SHA}.tar.gz"

          rm -rf "$bundle_dir" "$archive"
          mkdir -p "$bundle_dir/.next"
          cp -a backend/.next/standalone/. "$bundle_dir/"
          cp -a backend/.next/static "$bundle_dir/.next/static"

          if [[ -d backend/public ]]; then
            cp -a backend/public "$bundle_dir/public"
          fi
          if [[ -d backend/openapi ]]; then
            cp -a backend/openapi "$bundle_dir/openapi"
          fi

          tar -C "$bundle_dir" -czf "$archive" .
          echo "BUNDLE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Configure SSH
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Verify cPanel SSH and deploy directory
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          port="${CPANEL_SSH_PORT:-22}"
          printf -v deploy_path_q '%q' "$CPANEL_DEPLOY_PATH"

          ssh -T -p "$port" -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "set -e; command -v tar >/dev/null; mkdir -p ${deploy_path_q}; test -w ${deploy_path_q}; printf 'SSH preflight OK\\n'; df -Pk ${deploy_path_q} | tail -n 1"

      - name: Upload backend release archive
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          port="${CPANEL_SSH_PORT:-22}"
          archive="${CPANEL_DEPLOY_PATH}/.incoming-${GITHUB_SHA}.tar.gz"
          printf -v archive_q '%q' "$archive"

          ssh -T -p "$port" -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "set -e; cat > ${archive_q}; test -s ${archive_q}" < "$BUNDLE_ARCHIVE"

      - name: Activate backend release and restart Passenger
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          port="${CPANEL_SSH_PORT:-22}"
          archive="${CPANEL_DEPLOY_PATH}/.incoming-${GITHUB_SHA}.tar.gz"
          staging="${CPANEL_DEPLOY_PATH}/.deploy-${GITHUB_SHA}"
          printf -v deploy_path_q '%q' "$CPANEL_DEPLOY_PATH"
          printf -v archive_q '%q' "$archive"
          printf -v staging_q '%q' "$staging"

          remote_command="set -e; cleanup(){ rm -rf ${staging_q} ${archive_q}; }; trap cleanup EXIT; test -s ${archive_q}; rm -rf ${staging_q}; mkdir -p ${staging_q}; tar -xzf ${archive_q} -C ${staging_q}; test -f ${staging_q}/server.js; rm -rf ${deploy_path_q}/node_modules ${deploy_path_q}/.next ${deploy_path_q}/server.js ${deploy_path_q}/public ${deploy_path_q}/openapi; cp -a ${staging_q}/. ${deploy_path_q}/; mkdir -p ${deploy_path_q}/tmp; touch ${deploy_path_q}/tmp/restart.txt; printf 'Backend release activated\\n'"

          ssh -T -p "$port" -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$CPANEL_SSH_USER@$CPANEL_SSH_HOST" \
            "$remote_command"
