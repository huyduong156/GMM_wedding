name: CI

on:
  pull_request:
    branches:
      - develop
      - staging
      - production
  push:
    branches:
      - develop
      - staging
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:3000/api

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      APP_ENV: test
      APP_ORIGIN: http://localhost:8080
      APP_ORIGINS: http://localhost:8080,http://localhost:5173
      DATABASE_URL: postgresql://gmm_wedding:gmm_wedding_ci@localhost:5432/gmm_wedding?schema=public
      AUTH_SECRET: ci-auth-secret-change-me-1234567890
      AUTH_TOKEN_ENCRYPTION_KEY: ci-token-encryption-key-change-me-1234567890
      AUTH_RATE_LIMIT_SECRET: ci-rate-limit-secret-change-me-1234567890
      AUTH_RATE_LIMIT_DRIVER: disabled
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_SECURE: false
      SMTP_FROM: no-reply@gmm-wedding.local
      API_DOCS_ENABLED: false
      MEDIA_STORAGE_DRIVER: fake
      MEDIA_FAKE_ROOT: s3_upload_fake
      MEDIA_PUBLIC_BASE_URL: http://localhost:3000/api/media/fake-assets
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
