name: gmm_wedding_BE

services:
  backend:
    container_name: gmm_wedding_BE
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: gmm-wedding-backend:local
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-local}
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:8080,http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-gmm_wedding}:${POSTGRES_PASSWORD:-gmm_wedding_local}@postgres:5432/${POSTGRES_DB:-gmm_wedding}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-me-1234567890}
      AUTH_TOKEN_ENCRYPTION_KEY: ${AUTH_TOKEN_ENCRYPTION_KEY:-local-token-encryption-key-change-me-1234567890}
      AUTH_RATE_LIMIT_SECRET: ${AUTH_RATE_LIMIT_SECRET:-local-rate-limit-secret-change-me-1234567890}
      AUTH_RATE_LIMIT_DRIVER: ${AUTH_RATE_LIMIT_DRIVER:-disabled}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: 1025
      SMTP_SECURE: false
      SMTP_FROM: no-reply@gmm-wedding.local
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TRUST_PROXY: false
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_DOCS_ENABLED: true
      TEMPLATE_SOURCE_ROOT: /workspace/frontend/src/templates
      MEDIA_STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET: gmm-wedding
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ../frontend:/workspace/frontend:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  backend-migrate:
    container_name: gmm_wedding_BE_migrate
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    image: gmm-wedding-backend-migration:local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gmm_wedding}:${POSTGRES_PASSWORD:-gmm_wedding_local}@postgres:5432/${POSTGRES_DB:-gmm_wedding}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  backend-reset:
    container_name: gmm_wedding_BE_reset
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    image: gmm-wedding-backend-migration:local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gmm_wedding}:${POSTGRES_PASSWORD:-gmm_wedding_local}@postgres:5432/${POSTGRES_DB:-gmm_wedding}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]
    command: ["sh", "-lc", "npx prisma migrate reset --force --skip-seed && npm run db:seed"]

  minio:
    container_name: gmm_wedding_BE_minio
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - backend-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    container_name: gmm_wedding_BE_minio_init
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/gmm-wedding && mc anonymous set download local/gmm-wedding"]
  postgres:
    container_name: gmm_wedding_BE_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gmm_wedding}
      POSTGRES_USER: ${POSTGRES_USER:-gmm_wedding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gmm_wedding_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - backend-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-admin:
    container_name: gmm_wedding_BE_db_admin
    image: adminer:5.4.2-standalone
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${DB_ADMIN_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]
    restart: unless-stopped

  mailpit:
    container_name: gmm_wedding_BE_mailpit
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  redis:
    container_name: gmm_wedding_BE_redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - backend-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  backend-postgres-data:
  backend-redis-data:
  backend-minio-data:
