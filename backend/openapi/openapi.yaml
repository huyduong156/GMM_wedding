      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      responses: { '200': { description: UTF-8 BOM CSV export, content: { text/csv: { schema: { type: string } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
  /weddings/{weddingId}/invitations:
    parameters: [{ $ref: '#/components/parameters/WeddingId' }]
    get:
      operationId: listOwnedInvitations
      summary: List invitation metadata without exposing tokens
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: guestId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, REVOKED] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
      responses: { '200': { description: Invitation list, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationListEnvelope' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      operationId: createOwnedInvitation
      summary: Create an invitation and return its raw token once
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }, { $ref: '#/components/parameters/CsrfProtection' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateInvitationRequest' } } } }
      responses: { '201': { description: Invitation created with one-time token }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /weddings/{weddingId}/invitations/{invitationId}:
    parameters: [{ $ref: '#/components/parameters/WeddingId' }, { $ref: '#/components/parameters/InvitationId' }]
    get:
      operationId: getOwnedInvitation
      summary: Get invitation metadata without exposing tokens
      security: [{ cookieAuth: [] }]
      responses: { '200': { description: Invitation detail }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      operationId: updateOwnedInvitation
      summary: Update invitation metadata
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }, { $ref: '#/components/parameters/CsrfProtection' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateInvitationRequest' } } } }
      responses: { '200': { description: Invitation updated }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /weddings/{weddingId}/invitations/{invitationId}/rotate:
    post:
      operationId: rotateOwnedInvitationToken
      summary: Rotate an invitation token and return the new raw token once
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }, { $ref: '#/components/parameters/InvitationId' }, { $ref: '#/components/parameters/Origin' }, { $ref: '#/components/parameters/CsrfProtection' }]
      responses: { '200': { description: Invitation metadata and one-time raw token }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /weddings/{weddingId}/invitations/{invitationId}/revoke:
    post:
      operationId: revokeOwnedInvitation
      summary: Revoke an active invitation token
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }, { $ref: '#/components/parameters/InvitationId' }, { $ref: '#/components/parameters/Origin' }, { $ref: '#/components/parameters/CsrfProtection' }]
      responses: { '204': { description: Invitation revoked }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
  /templates:
    get:
      operationId: listTemplates
      summary: List active publication templates
      security: [{ cookieAuth: [] }]
      parameters:
        - name: productType
          in: query
          schema: { type: string, enum: [ONLINE_INVITATION, WEDDING_WEBSITE] }
      responses:
        '200': { description: Template catalog }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /templates/{templateKey}/versions/{version}:
    get:
      operationId: getTemplateVersion
      summary: Get immutable template version metadata and config
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: templateKey, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Template version }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/templates:
    get:
      operationId: listAdminTemplates
      summary: List template versions for admin review
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: productType, in: query, schema: { type: string, enum: [ONLINE_INVITATION, WEDDING_WEBSITE, RECAP] } }
        - { name: reviewStatus, in: query, schema: { type: string, enum: [PENDING_REVIEW, RELEASED, DEPRECATED] } }
      responses:
        '200': { description: Admin catalog with pendingReviewCount }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/templates/sync:
    post:
      operationId: syncTemplateReleaseBundle
      summary: Sync a template release bundle as versions awaiting review
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }, { $ref: '#/components/parameters/CsrfProtection' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateReleaseBundle' }
      responses:
        '200': { description: Created and unchanged version counts }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Immutable version conflict }
  /admin/templates/{templateKey}/versions/{version}:
    get:
      operationId: getAdminTemplateVersion
      summary: Get a template version for admin review
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: templateKey, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Version config and review status }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/templates/{templateKey}/versions/{version}/release:
    post:
      operationId: releaseTemplateVersion
      summary: Release an immutable version to the owner catalog
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: templateKey, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '200': { description: Released version }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Deprecated version cannot be released }
  /admin/templates/{templateKey}/versions/{version}/deprecate:
    post:
      operationId: deprecateTemplateVersion
      summary: Stop distributing a version without deleting references
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: templateKey, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '200': { description: Deprecated version }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /weddings/{weddingId}/content:
    parameters: [{ $ref: '#/components/parameters/WeddingId' }]
    get:
      operationId: getWeddingContent
      summary: Get canonical content and surface presentation config
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SurfaceQuery' }]
      responses:
        '200': { description: Wedding content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveWeddingContent
      summary: Save canonical content and one surface presentation config
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveWeddingContentRequest' }
      responses:
        '200': { description: Saved content }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /weddings/{weddingId}/publish:
    parameters: [{ $ref: '#/components/parameters/WeddingId' }]
    post:
      operationId: publishWeddingSurface
      summary: Publish an immutable wedding surface snapshot
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishWeddingRequest' }
      responses:
        '201': { description: Published snapshot }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /weddings/{weddingId}/unpublish:
    parameters: [{ $ref: '#/components/parameters/WeddingId' }]
    post:
      operationId: unpublishWeddingSurface
      summary: Revoke public access to one wedding surface
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [surface], properties: { surface: { $ref: '#/components/schemas/WeddingSurface' } } }
      responses:
        '204': { description: Surface unpublished }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /slugs/weddings/{slug}/availability:
    get:
      operationId: checkWeddingSlugAvailability
      summary: Check global live publication slug availability
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, minLength: 3, maxLength: 64 } }
        - { name: weddingId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Availability result }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /public/weddings/{slug}:
    get:
      operationId: getPublishedOnlineInvitation
      summary: Get the current public online invitation snapshot
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200': { description: Published snapshot }
        '304': { description: Snapshot has not changed }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/invitations/{invitationToken}:
    get:
      operationId: getInvitationByToken
      summary: Resolve a personalized invitation and current snapshot
      parameters: [{ $ref: '#/components/parameters/InvitationToken' }]
      responses:
        '200': { description: Personalized invitation }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/invitations/{invitationToken}/rsvp:
    put:
      operationId: submitInvitationTokenRsvp
      summary: Create or update RSVP for a personalized invitation token
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicRsvpRequest' }
      responses:
        '200': { description: RSVP saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/weddings/{slug}/wishes:
    get:
      operationId: listApprovedPublicWishes
      summary: List approved public wishes
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Approved public wishes, content: { application/json: { schema: { $ref: '#/components/schemas/PublicWishListEnvelope' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: submitCommonWish
      summary: Submit a wish through the common wedding URL
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/CsrfProtection' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicWishRequest' }
      responses:
        '201': { description: Wish submitted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/invitations/{weddingSlug}/{guestSlug}/wishes:
    post:
      operationId: submitPersonalWish
      summary: Submit a wish through a personalized invitation URL
      parameters:
        - { name: weddingSlug, in: path, required: true, schema: { type: string } }
        - { name: guestSlug, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/Origin' }
        - { $ref: '#/components/parameters/CsrfProtection' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicWishRequest' }
      responses:
        '201': { description: Wish submitted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /weddings/{weddingId}/media/upload-intents:
    parameters: [{ $ref: '#/components/parameters/WeddingId' }]
    post:
      operationId: createMediaUploadIntent
      summary: Create an image upload intent
      security: [{ cookieAuth: [] }]
      responses:
        '201': { description: Upload intent created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /weddings/{weddingId}/media:
    parameters: [{ $ref: '#/components/parameters/WeddingId' }]
    get:
      operationId: listWeddingMedia
      summary: List wedding media assets
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Media list }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /weddings/{weddingId}/media/{mediaId}/upload:
    put:
      operationId: uploadLocalFakeMedia
      summary: Upload bytes to the local fake-storage adapter
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, contentEncoding: binary } }
          image/png: { schema: { type: string, contentEncoding: binary } }
          image/webp: { schema: { type: string, contentEncoding: binary } }
          image/gif: { schema: { type: string, contentEncoding: binary } }
      responses:
        '200': { description: Bytes accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /weddings/{weddingId}/media/{mediaId}/complete:
    post:
      operationId: completeMediaUpload
      summary: Verify an uploaded object and mark the asset ready
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '200': { description: Ready media asset }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /weddings/{weddingId}/media/{mediaId}:
    delete:
      operationId: deleteWeddingMedia
      summary: Soft-delete a wedding media asset and remove its object
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '204': { description: Media removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the backend process is alive
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether required backend dependencies are ready
      responses:
        '200':
          description: Service is ready
        '503':
          description: A required dependency is unavailable
  /version:
    get:
      operationId: getVersion
      summary: Return minimal build metadata
      responses:
        '200':
          description: Build metadata
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gmm_session
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    CsrfProtection:
      name: X-CSRF-Protection
      in: header
      required: true
      schema:
        type: string
        const: '1'
    WeddingId:
      name: weddingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GuestId:
      name: guestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SurfaceQuery:
      name: surface
      in: query
      schema: { $ref: '#/components/schemas/WeddingSurface' }
    InvitationToken:
      name: invitationToken
      in: path
      required: true
      schema: { type: string, minLength: 20, maxLength: 512 }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid request or verification token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Credentials or session are invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Origin rejected, verification required, or account unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found or not owned by the current user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Optimistic concurrency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    TemplateReleaseBundle:
      type: object
      required: [bundleVersion, generatedAt, sourceRevision, templates]
      properties:
        bundleVersion: { type: integer, const: 1 }
        generatedAt: { type: string, format: date-time }
        sourceRevision: { type: string, maxLength: 128 }
        templates:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [templateKey, displayName, productType, templateVersion, templateConfigVersion, contentSchemaVersion, rendererApiVersion, config]
            properties:
              templateKey: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
              displayName: { type: string, maxLength: 160 }
              productType: { type: string, enum: [ONLINE_INVITATION, WEDDING_WEBSITE, RECAP] }
              templateVersion: { type: string, example: 1.0.0 }
              templateConfigVersion: { type: integer, minimum: 1 }
              contentSchemaVersion: { type: integer, minimum: 1 }
              rendererApiVersion: { type: integer, minimum: 1 }
              description: { type: [string, 'null'], maxLength: 5000 }
              config: { type: object, additionalProperties: true }
    WeddingSurface:
      type: string
      enum: [ONLINE_INVITATION, WEDDING_WEBSITE]
    TaskEvent:
      type: object
      required: [id, name, eventType, startsAt, endsAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        eventType: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
    Task:
      type: object
      additionalProperties: false
      required: [id, weddingId, eventId, event, parentTaskId, title, description, dueAt, priority, status, sortOrder, completedAt, completedById, sourceTemplateKey, sourceTemplateVersion, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        weddingId: { type: string, format: uuid }
        eventId: { type: [string, 'null'], format: uuid }
        event: { anyOf: [{ $ref: '#/components/schemas/TaskEvent' }, { type: 'null' }] }
        parentTaskId: { type: [string, 'null'], format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        dueAt: { type: [string, 'null'], format: date-time }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT] }
        status: { type: string, enum: [TODO, IN_PROGRESS, DONE, CANCELLED] }
        sortOrder: { type: integer, minimum: 0 }
        completedAt: { type: [string, 'null'], format: date-time }
        completedById: { type: [string, 'null'], format: uuid }
        sourceTemplateKey: { type: [string, 'null'] }
        sourceTemplateVersion: { type: [integer, 'null'], minimum: 1 }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskEnvelope:
      type: object
      required: [task]
      properties:
        task: { $ref: '#/components/schemas/Task' }
    TaskListEnvelope:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Task' } }
        nextCursor: { type: [string, 'null'] }
    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        eventId: { type: [string, 'null'], format: uuid }
        parentTaskId: { type: [string, 'null'], format: uuid }
        dueAt: { type: string, format: date-time }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT], default: MEDIUM }
    UpdateTaskRequest:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: [string, 'null'], maxLength: 5000 }
        eventId: { type: [string, 'null'], format: uuid }
        parentTaskId: { type: [string, 'null'], format: uuid }
        dueAt: { type: [string, 'null'], format: date-time }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT] }
