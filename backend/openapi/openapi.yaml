openapi: 3.1.0
info:
  title: GMM Wedding Backend API
  version: 0.2.0
  description: Backend API contract for platform foundation, server-managed authentication, Wedding core, display events, and the owner dashboard read model.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:3000/api
    description: Local developmenta
security: []
paths:
  /auth/register:
    post:
      operationId: registerUser
      summary: Register an account and request email verification
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Generic acknowledgment, whether or not the email already exists
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Consume a one-time email verification token
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: Email verified
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/resend-verification:
    post:
      operationId: resendVerificationEmail
      summary: Request a fresh verification email for a pending account
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '202':
          description: Generic acknowledgment whether or not an eligible pending account exists
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      operationId: login
      summary: Create a server-managed session
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded and the session cookie is set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/admin/login:
    post:
      operationId: loginPlatformAdmin
      summary: Create a session for the platform administration surface
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Admin login succeeded and the session cookie is set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session and clear its cookie
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '204':
          description: Logout completed idempotently
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request password recovery for an eligible non-admin user account
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Generic acknowledgment whether or not an eligible account exists
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Consume a one-time user password reset token and revoke existing sessions
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password reset and existing sessions revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me:
    get:
      operationId: getCurrentUser
      summary: Return the user associated with the current session
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/me:
    get:
      operationId: getCurrentPlatformAdmin
      summary: Return the current platform administrator actor
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current platform administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminIdentityEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /weddings:
    get:
      operationId: listOwnedWeddings
      summary: List non-deleted weddings owned by the current user
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Owned weddings ordered by recent update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createWedding
      summary: Create a minimal wedding and its internal owner membership
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWeddingRequest'
      responses:
        '201':
          description: Wedding created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /weddings/{weddingId}:
    parameters:
      - $ref: '#/components/parameters/WeddingId'
    get:
      operationId: getOwnedWedding
      summary: Get one owned wedding
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Wedding detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateOwnedWedding
      summary: Update basic wedding settings with optimistic concurrency
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWeddingRequest'
      responses:
        '200':
          description: Wedding updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteOwnedWedding
      summary: Soft-delete an owned wedding and revoke its public wedding slug
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '204':
          description: Wedding deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /weddings/{weddingId}/events:
    parameters:
      - $ref: '#/components/parameters/WeddingId'
    get:
      operationId: listWeddingEvents
      summary: List display events for an owned wedding
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Ordered event list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingEventListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createWeddingEvent
      summary: Add a ceremony or reception used by publications and RSVP
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWeddingEventRequest'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingEventEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /weddings/{weddingId}/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/WeddingId'
      - $ref: '#/components/parameters/EventId'
    patch:
      operationId: updateWeddingEvent
      summary: Update a display event
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWeddingEventRequest'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingEventEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteWeddingEvent
      summary: Soft-delete a display event
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '204':
          description: Event deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /weddings/{weddingId}/dashboard:
    parameters:
      - $ref: '#/components/parameters/WeddingId'
    get:
      operationId: getWeddingDashboard
      summary: Return the owner dashboard read model for one wedding
      description: Aggregates publication state, guest/invitation/RSVP/wish metrics, upcoming event, 30-day response trend and recent activity. View counts remain null until analytics tracking exists.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Dashboard read model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingDashboardEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /templates:
    get:
      operationId: listTemplates
      summary: List active publication templates
      security: [{ cookieAuth: [] }]
      parameters:
        - name: productType
          in: query
          schema: { type: string, enum: [ONLINE_INVITATION, WEDDING_WEBSITE] }
      responses:
        '200': { description: Template catalog }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /templates/{templateKey}/versions/{version}:
    get:
      operationId: getTemplateVersion
      summary: Get immutable template version metadata and config
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: templateKey, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Template version }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/templates:
    get:
      operationId: listAdminTemplates
      summary: List template versions for admin review
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: productType, in: query, schema: { type: string, enum: [ONLINE_INVITATION, WEDDING_WEBSITE, RECAP] } }
        - { name: reviewStatus, in: query, schema: { type: string, enum: [PENDING_REVIEW, RELEASED, DEPRECATED] } }
      responses:
        '200': { description: Admin catalog with pendingReviewCount }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/templates/sync:
    post:
      operationId: syncTemplateReleaseBundle
      summary: Sync a template release bundle as versions awaiting review
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/Origin' }, { $ref: '#/components/parameters/CsrfProtection' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateReleaseBundle' }
      responses:
        '200': { description: Created and unchanged version counts }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Immutable version conflict }
  /admin/templates/{templateKey}/versions/{version}:
    get:
      operationId: getAdminTemplateVersion
      summary: Get a template version for admin review
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: templateKey, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Version config and review status }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/templates/{templateKey}/versions/{version}/release:
    post:
      operationId: releaseTemplateVersion
      summary: Release an immutable version to the owner catalog
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: templateKey, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '200': { description: Released version }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Deprecated version cannot be released }
  /admin/templates/{templateKey}/versions/{version}/deprecate:
    post:
      operationId: deprecateTemplateVersion
      summary: Stop distributing a version without deleting references
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: templateKey, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '200': { description: Deprecated version }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /weddings/{weddingId}/content:
    parameters: [{ $ref: '#/components/parameters/WeddingId' }]
    get:
      operationId: getWeddingContent
      summary: Get canonical content and surface presentation config
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/SurfaceQuery' }]
      responses:
        '200': { description: Wedding content }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveWeddingContent
      summary: Save canonical content and one surface presentation config
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveWeddingContentRequest' }
      responses:
        '200': { description: Saved content }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /weddings/{weddingId}/publish:
    parameters: [{ $ref: '#/components/parameters/WeddingId' }]
    post:
      operationId: publishWeddingSurface
      summary: Publish an immutable wedding surface snapshot
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishWeddingRequest' }
      responses:
        '201': { description: Published snapshot }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /weddings/{weddingId}/unpublish:
    parameters: [{ $ref: '#/components/parameters/WeddingId' }]
    post:
      operationId: unpublishWeddingSurface
      summary: Revoke public access to one wedding surface
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [surface], properties: { surface: { $ref: '#/components/schemas/WeddingSurface' } } }
      responses:
        '204': { description: Surface unpublished }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /slugs/weddings/{slug}/availability:
    get:
      operationId: checkWeddingSlugAvailability
      summary: Check global live publication slug availability
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, minLength: 3, maxLength: 64 } }
        - { name: weddingId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Availability result }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /public/weddings/{slug}:
    get:
      operationId: getPublishedOnlineInvitation
      summary: Get the current public online invitation snapshot
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200': { description: Published snapshot }
        '304': { description: Snapshot has not changed }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/invitations/{invitationToken}:
    get:
      operationId: getInvitationByToken
      summary: Resolve a personalized invitation and current snapshot
      parameters: [{ $ref: '#/components/parameters/InvitationToken' }]
      responses:
        '200': { description: Personalized invitation }
        '404': { $ref: '#/components/responses/NotFound' }
  /public/invitations/{invitationToken}/rsvp:
    put:
      operationId: submitInvitationTokenRsvp
      summary: Create or update RSVP for a personalized invitation token
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicRsvpRequest' }
      responses:
        '200': { description: RSVP saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /weddings/{weddingId}/media/upload-intents:
    parameters: [{ $ref: '#/components/parameters/WeddingId' }]
    post:
      operationId: createMediaUploadIntent
      summary: Create an image upload intent
      security: [{ cookieAuth: [] }]
      responses:
        '201': { description: Upload intent created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /weddings/{weddingId}/media:
    parameters: [{ $ref: '#/components/parameters/WeddingId' }]
    get:
      operationId: listWeddingMedia
      summary: List wedding media assets
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Media list }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /weddings/{weddingId}/media/{mediaId}/upload:
    put:
      operationId: uploadLocalFakeMedia
      summary: Upload bytes to the local fake-storage adapter
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, contentEncoding: binary } }
          image/png: { schema: { type: string, contentEncoding: binary } }
          image/webp: { schema: { type: string, contentEncoding: binary } }
          image/gif: { schema: { type: string, contentEncoding: binary } }
      responses:
        '200': { description: Bytes accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /weddings/{weddingId}/media/{mediaId}/complete:
    post:
      operationId: completeMediaUpload
      summary: Verify an uploaded object and mark the asset ready
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '200': { description: Ready media asset }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /weddings/{weddingId}/media/{mediaId}:
    delete:
      operationId: deleteWeddingMedia
      summary: Soft-delete a wedding media asset and remove its object
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/WeddingId'
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '204': { description: Media removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the backend process is alive
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether required backend dependencies are ready
      responses:
        '200':
          description: Service is ready
        '503':
          description: A required dependency is unavailable
  /version:
    get:
      operationId: getVersion
      summary: Return minimal build metadata
      responses:
        '200':
          description: Build metadata
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gmm_session
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    CsrfProtection:
      name: X-CSRF-Protection
      in: header
      required: true
      schema:
        type: string
        const: '1'
    WeddingId:
      name: weddingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SurfaceQuery:
      name: surface
      in: query
      schema: { $ref: '#/components/schemas/WeddingSurface' }
    InvitationToken:
      name: invitationToken
      in: path
      required: true
      schema: { type: string, minLength: 20, maxLength: 512 }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid request or verification token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Credentials or session are invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Origin rejected, verification required, or account unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found or not owned by the current user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Optimistic concurrency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    TemplateReleaseBundle:
      type: object
      required: [bundleVersion, generatedAt, sourceRevision, templates]
      properties:
        bundleVersion: { type: integer, const: 1 }
        generatedAt: { type: string, format: date-time }
        sourceRevision: { type: string, maxLength: 128 }
        templates:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [templateKey, displayName, productType, templateVersion, templateConfigVersion, contentSchemaVersion, rendererApiVersion, config]
            properties:
              templateKey: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
              displayName: { type: string, maxLength: 160 }
              productType: { type: string, enum: [ONLINE_INVITATION, WEDDING_WEBSITE, RECAP] }
              templateVersion: { type: string, example: 1.0.0 }
              templateConfigVersion: { type: integer, minimum: 1 }
              contentSchemaVersion: { type: integer, minimum: 1 }
              rendererApiVersion: { type: integer, minimum: 1 }
              description: { type: [string, 'null'], maxLength: 5000 }
              config: { type: object, additionalProperties: true }
    WeddingSurface:
      type: string
      enum: [ONLINE_INVITATION, WEDDING_WEBSITE]
    SaveWeddingContentRequest:
      type: object
      additionalProperties: false
      required: [surface, templateVersionId, content, themeConfig, sectionConfig, revision]
      properties:
        surface: { $ref: '#/components/schemas/WeddingSurface' }
        templateVersionId: { type: string, format: uuid }
        content: { type: object, additionalProperties: true }
        themeConfig: { type: object, additionalProperties: true }
        sectionConfig:
          type: object
          additionalProperties: false
          required: [enabled, order]
          properties:
            enabled: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
            order: { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
        revision: { type: integer, minimum: 1 }
    PublishWeddingRequest:
      type: object
      additionalProperties: false
      required: [surface, slug, revision]
      properties:
        surface: { $ref: '#/components/schemas/WeddingSurface' }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', minLength: 3, maxLength: 64 }
        revision: { type: integer, minimum: 1 }
    PublicRsvpRequest:
      type: object
      additionalProperties: false
      required: [attendance, partySize]
      properties:
        attendance: { type: string, enum: [ATTENDING, DECLINED, MAYBE] }
        partySize: { type: integer, minimum: 1, maximum: 50 }
        mealPreference: { type: string, maxLength: 160 }
        specialRequest: { type: string, maxLength: 2000 }
        message: { type: string, maxLength: 2000 }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 12
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 120
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 512
    ResendVerificationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 512
        password:
          type: string
          minLength: 12
          maxLength: 128
    User:
      type: object
      additionalProperties: false
      required: [id, email, displayName, emailVerifiedAt, locale, timezone, status, roles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: [string, 'null']
        emailVerifiedAt:
          type: [string, 'null']
          format: date-time
        locale:
          type: string
        timezone:
          type: string
        status:
          type: string
          enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DELETED]
        roles:
          type: array
          items:
            type: string
            enum: [ADMIN, SUPPORT, MODERATOR]
    UserEnvelope:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    PlatformAdminActor:
      type: object
      additionalProperties: false
      required: [kind, userId, sessionId, assurance]
      properties:
        kind:
          type: string
          const: platformAdmin
        userId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        assurance:
          type: string
          enum: [base, stepUp]
    AdminIdentityEnvelope:
      type: object
      additionalProperties: false
      required: [user, actor]
      properties:
        user:
          $ref: '#/components/schemas/User'
        actor:
          $ref: '#/components/schemas/PlatformAdminActor'
    Wedding:
      type: object
      additionalProperties: false
      required: [id, name, status, visibility, timezone, locale, primaryDate, revision, publishedAt, archivedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 160 }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        visibility: { type: string, enum: [PUBLIC, PASSWORD_PROTECTED, INVITE_ONLY] }
        timezone: { type: string, maxLength: 64 }
        locale: { type: string, maxLength: 16 }
        primaryDate: { type: [string, 'null'], format: date-time }
        revision: { type: integer, minimum: 1 }
        publishedAt: { type: [string, 'null'], format: date-time }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateWeddingRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        primaryDate: { type: string, format: date-time }
        timezone: { type: string, default: Asia/Ho_Chi_Minh, maxLength: 64 }
        locale: { type: string, default: vi-VN, maxLength: 16 }
        visibility: { type: string, enum: [PUBLIC, PASSWORD_PROTECTED, INVITE_ONLY], default: PUBLIC }
    UpdateWeddingRequest:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [revision]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        primaryDate: { type: [string, 'null'], format: date-time }
        timezone: { type: string, maxLength: 64 }
        locale: { type: string, maxLength: 16 }
        visibility: { type: string, enum: [PUBLIC, PASSWORD_PROTECTED, INVITE_ONLY] }
        status: { type: string, enum: [DRAFT, ARCHIVED] }
        revision: { type: integer, minimum: 1 }
    WeddingEnvelope:
      type: object
      additionalProperties: false
      required: [wedding]
      properties:
        wedding: { $ref: '#/components/schemas/Wedding' }
    WeddingListEnvelope:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Wedding' }
    WeddingEvent:
      type: object
      additionalProperties: false
      required: [id, weddingId, name, eventType, startsAt, endsAt, timezone, venueName, addressLine, mapUrl, latitude, longitude, sortOrder, isPublic, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        weddingId: { type: string, format: uuid }
        name: { type: string, maxLength: 160 }
        eventType: { type: string, maxLength: 48 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        timezone: { type: string, maxLength: 64 }
        venueName: { type: [string, 'null'] }
        addressLine: { type: [string, 'null'] }
        mapUrl: { type: [string, 'null'], format: uri }
        latitude: { type: [string, 'null'] }
        longitude: { type: [string, 'null'] }
        sortOrder: { type: integer, minimum: 0 }
        isPublic: { type: boolean }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateWeddingEventRequest:
      type: object
      additionalProperties: false
      required: [name, eventType, startsAt, timezone]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        eventType: { type: string, minLength: 1, maxLength: 48 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string, maxLength: 64 }
        venueName: { type: string, maxLength: 200 }
        addressLine: { type: string, maxLength: 500 }
        mapUrl: { type: string, format: uri, maxLength: 2048 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        sortOrder: { type: integer, minimum: 0, default: 0 }
        isPublic: { type: boolean, default: true }
    UpdateWeddingEventRequest:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [revision]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        eventType: { type: string, minLength: 1, maxLength: 48 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        timezone: { type: string, maxLength: 64 }
        venueName: { type: [string, 'null'], maxLength: 200 }
        addressLine: { type: [string, 'null'], maxLength: 500 }
        mapUrl: { type: [string, 'null'], format: uri, maxLength: 2048 }
        latitude: { type: [number, 'null'], minimum: -90, maximum: 90 }
        longitude: { type: [number, 'null'], minimum: -180, maximum: 180 }
        sortOrder: { type: integer, minimum: 0 }
        isPublic: { type: boolean }
        revision: { type: integer, minimum: 1 }
    WeddingEventEnvelope:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event: { $ref: '#/components/schemas/WeddingEvent' }
    WeddingEventListEnvelope:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WeddingEvent' }
    WeddingDashboardEnvelope:
      type: object
      additionalProperties: false
      required: [dashboard]
      properties:
        dashboard:
          type: object
          required: [wedding, publication, metrics, nextEvent, responseTrend, recentActivity]
          properties:
            wedding: { $ref: '#/components/schemas/Wedding' }
            publication:
              type: object
              additionalProperties: false
              required: [invitation, website, recap]
              properties:
                invitation: { $ref: '#/components/schemas/PublicationSurfaceStatus' }
                website: { $ref: '#/components/schemas/PublicationSurfaceStatus' }
                recap: { $ref: '#/components/schemas/RecapPublicationStatus' }
            metrics:
              type: object
              required: [guests, invitations, activeInvitations, responses, attending, declined, maybe, pendingResponses, attendingPartySize, companions, pendingWishes, approvedWishes]
              properties:
                guests: { type: integer, minimum: 0 }
                invitations: { type: integer, minimum: 0 }
                activeInvitations: { type: integer, minimum: 0 }
                responses: { type: integer, minimum: 0 }
                attending: { type: integer, minimum: 0 }
                declined: { type: integer, minimum: 0 }
                maybe: { type: integer, minimum: 0 }
                pendingResponses: { type: integer, minimum: 0 }
                attendingPartySize: { type: integer, minimum: 0 }
                companions: { type: integer, minimum: 0 }
                pendingWishes: { type: integer, minimum: 0 }
                approvedWishes: { type: integer, minimum: 0 }
            nextEvent: { anyOf: [{ $ref: '#/components/schemas/WeddingEvent' }, { type: 'null' }] }
            responseTrend:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [date, count]
                properties:
                  date: { type: string, format: date }
                  count: { type: integer, minimum: 0 }
            recentActivity:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, type, displayName, attendance, partySize, occurredAt]
                properties:
                  id: { type: string, format: uuid }
                  type: { type: string, enum: [RSVP_SUBMITTED, WISH_SUBMITTED] }
                  displayName: { type: string }
                  attendance: { type: [string, 'null'], enum: [ATTENDING, DECLINED, MAYBE, null] }
                  partySize: { type: [integer, 'null'] }
                  occurredAt: { type: string, format: date-time }
    PublicationSurfaceStatus:
      type: object
      additionalProperties: false
      required: [configured, published, slug, templateName, templateVersion, views]
      properties:
        configured: { type: boolean }
        published: { type: boolean }
        slug: { type: [string, 'null'] }
        templateName: { type: [string, 'null'] }
        templateVersion: { type: [string, 'null'] }
        views: { type: 'null', description: Analytics tracking is not implemented yet. }
    RecapPublicationStatus:
      type: object
      additionalProperties: false
      required: [configured, published, slug, views]
      properties:
        configured: { type: boolean }
        published: { type: boolean }
        slug: { type: [string, 'null'] }
        views: { type: 'null', description: Analytics tracking is not implemented yet. }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status, service, requestId]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: gmm-wedding-backend
        requestId:
          type: string
