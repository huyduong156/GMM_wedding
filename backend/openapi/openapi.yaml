        revision: { type: integer, minimum: 1 }
    WeddingEventEnvelope:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event: { $ref: '#/components/schemas/WeddingEvent' }
    WeddingEventListEnvelope:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WeddingEvent' }
    WeddingDashboardEnvelope:
      type: object
      additionalProperties: false
      required: [dashboard]
      properties:
        dashboard:
          type: object
          required: [wedding, publication, metrics, nextEvent, responseTrend, recentActivity]
          properties:
            wedding: { $ref: '#/components/schemas/Wedding' }
            publication:
              type: object
              additionalProperties: false
              required: [invitation, website, recap]
              properties:
                invitation: { $ref: '#/components/schemas/PublicationSurfaceStatus' }
                website: { $ref: '#/components/schemas/PublicationSurfaceStatus' }
                recap: { $ref: '#/components/schemas/RecapPublicationStatus' }
            metrics:
              type: object
              required: [guests, invitations, activeInvitations, responses, attending, declined, maybe, pendingResponses, attendingPartySize, companions, pendingWishes, approvedWishes]
              properties:
                guests: { type: integer, minimum: 0 }
                invitations: { type: integer, minimum: 0 }
                activeInvitations: { type: integer, minimum: 0 }
                responses: { type: integer, minimum: 0 }
                attending: { type: integer, minimum: 0 }
                declined: { type: integer, minimum: 0 }
                maybe: { type: integer, minimum: 0 }
                pendingResponses: { type: integer, minimum: 0 }
                attendingPartySize: { type: integer, minimum: 0 }
                companions: { type: integer, minimum: 0 }
                pendingWishes: { type: integer, minimum: 0 }
                approvedWishes: { type: integer, minimum: 0 }
            nextEvent: { anyOf: [{ $ref: '#/components/schemas/WeddingEvent' }, { type: 'null' }] }
            responseTrend:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [date, count]
                properties:
                  date: { type: string, format: date }
                  count: { type: integer, minimum: 0 }
            recentActivity:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, type, displayName, attendance, partySize, occurredAt]
                properties:
                  id: { type: string, format: uuid }
                  type: { type: string, enum: [RSVP_SUBMITTED, WISH_SUBMITTED] }
                  displayName: { type: string }
                  attendance: { type: [string, 'null'], enum: [ATTENDING, DECLINED, MAYBE, null] }
                  partySize: { type: [integer, 'null'] }
                  occurredAt: { type: string, format: date-time }
    PublicationSurfaceStatus:
      type: object
      additionalProperties: false
      required: [configured, published, slug, templateName, templateVersion, views]
      properties:
        configured: { type: boolean }
        published: { type: boolean }
        slug: { type: [string, 'null'] }
        templateName: { type: [string, 'null'] }
        templateVersion: { type: [string, 'null'] }
        views: { type: 'null', description: Analytics tracking is not implemented yet. }
    RecapPublicationStatus:
      type: object
      additionalProperties: false
      required: [configured, published, slug, views]
      properties:
        configured: { type: boolean }
        published: { type: boolean }
        slug: { type: [string, 'null'] }
        views: { type: 'null', description: Analytics tracking is not implemented yet. }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status, service, requestId]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: gmm-wedding-backend
        requestId:
          type: string
