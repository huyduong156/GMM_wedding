        timezone: { type: string, default: Asia/Ho_Chi_Minh, maxLength: 64 }
        locale: { type: string, default: vi-VN, maxLength: 16 }
        visibility: { type: string, enum: [PUBLIC, PASSWORD_PROTECTED, INVITE_ONLY], default: PUBLIC }
    UpdateWeddingRequest:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [revision]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        primaryDate: { type: [string, 'null'], format: date-time }
        timezone: { type: string, maxLength: 64 }
        locale: { type: string, maxLength: 16 }
        visibility: { type: string, enum: [PUBLIC, PASSWORD_PROTECTED, INVITE_ONLY] }
