openapi: 3.1.0
info:
  title: GMM Wedding Backend API
  version: 0.3.0
  description: Backend API contract for platform foundation, server-managed authentication, Wedding core, owner guest management, invitations, display events, and the owner dashboard read model.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:3000/api
    description: Local developmenta
security: []
paths:
  /auth/register:
    post:
      operationId: registerUser
      summary: Register an account and request email verification
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Generic acknowledgment, whether or not the email already exists
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Consume a one-time email verification token
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '204':
          description: Email verified
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/resend-verification:
    post:
      operationId: resendVerificationEmail
      summary: Request a fresh verification email for a pending account
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '202':
          description: Generic acknowledgment whether or not an eligible pending account exists
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      operationId: login
      summary: Create a server-managed session
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded and the session cookie is set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/admin/login:
    post:
      operationId: loginPlatformAdmin
      summary: Create a session for the platform administration surface
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Admin login succeeded and the session cookie is set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session and clear its cookie
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '204':
          description: Logout completed idempotently
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request password recovery for an eligible non-admin user account
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Generic acknowledgment whether or not an eligible account exists
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Consume a one-time user password reset token and revoke existing sessions
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password reset and existing sessions revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me:
    get:
      operationId: getCurrentUser
      summary: Return the user associated with the current session
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/password:
    post:
      operationId: changeCurrentPassword
      summary: Change current password and revoke other sessions
      security:
        - cookieAuth: []
      responses:
        '204': { description: Password changed }
        '400': { $ref: '#/components/responses/BadRequest' }
  /me/sessions:
    get:
      operationId: listCurrentUserSessions
      summary: List active sessions for current user
      security:
        - cookieAuth: []
      responses:
        '200': { description: Active sessions }
    post:
      operationId: revokeCurrentUserSessions
      summary: Revoke all other sessions for current user
      security:
        - cookieAuth: []
      responses:
        '200': { description: Sessions revoked }
  /me/sessions/{sessionId}:
    delete:
      operationId: revokeCurrentUserSession
      summary: Revoke one current-user session
      security:
        - cookieAuth: []
      responses:
        '204': { description: Session revoked }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/me:
    get:
      operationId: getCurrentPlatformAdmin
      summary: Return the current platform administrator actor
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current platform administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminIdentityEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users:
    get:
      operationId: listAdminUsers
      summary: List users for platform administration
      security:
        - cookieAuth: []
      responses:
        '200': { description: User list and status summary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users/invite:
    post:
      operationId: inviteAdminUser
      summary: Invite a user and send a password setup link
      security:
        - cookieAuth: []
      responses:
        '202': { description: Invitation accepted }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/users/bulk-status:
    post:
      operationId: bulkUpdateAdminUserStatus
      summary: Update status for multiple users
      security:
        - cookieAuth: []
      responses:
        '200': { description: Number of updated users }
  /admin/users/{userId}:
    get:
      operationId: getAdminUser
      summary: Get one user for platform administration
      security:
        - cookieAuth: []
      responses:
        '200': { description: User detail }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAdminUser
      summary: Update user status or system roles
      security:
        - cookieAuth: []
      responses:
        '200': { description: Updated user }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/users/{userId}/resend-verification:
    post:
      operationId: resendAdminUserVerification
      summary: Resend verification email for a pending user
      security:
        - cookieAuth: []
      responses:
        '202': { description: Verification request processed }
  /admin/users/{userId}/audit-logs:
    get:
      operationId: listAdminUserAuditLogs
      summary: List audit records for a user
      security:
        - cookieAuth: []
      responses:
        '200': { description: User audit records }
  /admin/users/{userId}/sessions/revoke-all:
    post:
      operationId: revokeAdminUserSessions
      summary: Revoke all sessions for a user
      security:
        - cookieAuth: []
      responses:
        '200': { description: Number of revoked sessions }
  /weddings:
    get:
      operationId: listOwnedWeddings
      summary: List non-deleted weddings owned by the current user
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Owned weddings ordered by recent update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createWedding
      summary: Create a minimal wedding and its internal owner membership
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWeddingRequest'
      responses:
        '201':
          description: Wedding created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /weddings/{weddingId}:
    parameters:
      - $ref: '#/components/parameters/WeddingId'
    get:
      operationId: getOwnedWedding
      summary: Get one owned wedding
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Wedding detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateOwnedWedding
      summary: Update basic wedding settings with optimistic concurrency
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWeddingRequest'
      responses:
        '200':
          description: Wedding updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteOwnedWedding
      summary: Soft-delete an owned wedding and revoke its public wedding slug
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '204':
          description: Wedding deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /weddings/{weddingId}/events:
    parameters:
      - $ref: '#/components/parameters/WeddingId'
    get:
      operationId: listWeddingEvents
      summary: List display events for an owned wedding
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Ordered event list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingEventListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createWeddingEvent
      summary: Add a ceremony or reception used by publications and RSVP
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWeddingEventRequest'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingEventEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /weddings/{weddingId}/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/WeddingId'
      - $ref: '#/components/parameters/EventId'
    patch:
      operationId: updateWeddingEvent
      summary: Update a display event
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWeddingEventRequest'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingEventEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteWeddingEvent
      summary: Soft-delete a display event
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CsrfProtection'
      responses:
        '204':
          description: Event deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /weddings/{weddingId}/dashboard:
    parameters:
      - $ref: '#/components/parameters/WeddingId'
    get:
      operationId: getWeddingDashboard
      summary: Return the owner dashboard read model for one wedding
      description: Aggregates publication state, guest/invitation/RSVP/wish metrics, upcoming event, 30-day response trend and recent activity. View counts remain null until analytics tracking exists.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Dashboard read model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeddingDashboardEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /weddings/{weddingId}/rsvps:
    get:
      operationId: listOwnedRsvps
      summary: List RSVP responses for an owned wedding
      description: Supports filtering by attendance, event, guest category/group, guest name and submitted date range. The response includes guest, invitation, companion and event selection data for the owner RSVP table.
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: q, in: query, schema: { type: string, maxLength: 160 } }
        - { name: attendance, in: query, schema: { type: string, enum: [ATTENDING, DECLINED, MAYBE] } }
        - { name: eventId, in: query, schema: { type: string, format: uuid } }
        - { name: categoryId, in: query, schema: { type: string, format: uuid } }
        - { name: groupId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
      responses:
        '200': { description: Owner RSVP list, content: { application/json: { schema: { $ref: '#/components/schemas/RsvpListEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /weddings/{weddingId}/rsvps/{rsvpId}/promote-to-guest:
    post:
      operationId: promoteRsvpToGuest
      summary: Add an anonymous RSVP respondent to the guest list
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: rsvpId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoteRsvpRequest' }
      responses:
        '201': { description: Guest created and linked, content: { application/json: { schema: { $ref: '#/components/schemas/RsvpGuestLinkEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /weddings/{weddingId}/rsvps/{rsvpId}/link-guest:
    post:
      operationId: linkRsvpToGuest
      summary: Link an RSVP to an existing guest
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: rsvpId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkRsvpGuestRequest' }
      responses:
        '200': { description: RSVP linked to guest, content: { application/json: { schema: { $ref: '#/components/schemas/RsvpGuestLinkEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /task-checklist-templates:
    get:
      operationId: listTaskChecklistTemplates
      summary: List active task checklist templates
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: locale, in: query, schema: { type: string, minLength: 2, maxLength: 16 } }
      responses:
        '200': { description: Active checklist templates, content: { application/json: { schema: { $ref: '#/components/schemas/TaskChecklistTemplateListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /weddings/{weddingId}/tasks:
    get:
      operationId: listWeddingTasks
      summary: List and filter tasks for an owned wedding
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { type: string, enum: [TODO, IN_PROGRESS, DONE, CANCELLED] } }
        - { name: priority, in: query, schema: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT] } }
        - { name: eventId, in: query, schema: { type: string, format: uuid } }
        - { name: withoutEvent, in: query, schema: { type: boolean } }
        - { name: parentTaskId, in: query, schema: { type: string, format: uuid } }
        - { name: withoutParent, in: query, schema: { type: boolean } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
      responses:
        '200': { description: Task list, content: { application/json: { schema: { $ref: '#/components/schemas/TaskListEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createWeddingTask
      summary: Create a task optionally linked to a wedding event and parent task
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201': { description: Created task, content: { application/json: { schema: { $ref: '#/components/schemas/TaskEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /weddings/{weddingId}/tasks/{taskId}:
    get:
      operationId: getWeddingTask
      summary: Get a task
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Task, content: { application/json: { schema: { $ref: '#/components/schemas/TaskEnvelope' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateWeddingTask
      summary: Update a task with optimistic revision control
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaskRequest' }
      responses:
        '200': { description: Updated task, content: { application/json: { schema: { $ref: '#/components/schemas/TaskEnvelope' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: deleteWeddingTask
      summary: Soft-delete a task
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/WeddingId' }
        - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Task deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /weddings/{weddingId}/tasks/reorder:
    post:
      operationId: reorderWeddingTasks
      summary: Reorder up to 200 tasks
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderTasksRequest' }
      responses:
        '200': { description: Reordered tasks }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /weddings/{weddingId}/tasks/bulk-status:
    post:
      operationId: bulkUpdateTaskStatus
      summary: Update status for up to 200 tasks
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/WeddingId' }]
      requestBody:
        required: true
        content:
          application/json:
