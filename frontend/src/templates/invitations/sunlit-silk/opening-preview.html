<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nắng Trên Lụa — opening artwork preview</title>
  <style>
    :root { color-scheme: light; font-family: "Be Vietnam Pro", Arial, sans-serif; background: #d8c9b1; color: #282521; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; }
    .stage { position: relative; width: min(100%, 480px); min-height: 780px; overflow: hidden; isolation: isolate; background: linear-gradient(145deg, #f8f3e9, #e8dcc7); box-shadow: 0 24px 70px #584b3f30; }
    .sun { position: absolute; inset: -10% -35% auto; width: 170%; height: 70%; opacity: .42; transform: rotate(-12deg); background: linear-gradient(118deg, transparent 30%, #fff9 50%, transparent 67%); filter: blur(22px); }
    .flowers { position: absolute; z-index: 1; left: -10%; bottom: -1%; width: 58%; max-width: 286px; opacity: .94; }
    .sculpture { position: absolute; z-index: 1; right: -8%; top: 13%; width: 47%; max-width: 240px; opacity: .88; }
    .envelope { position: absolute; z-index: 1; right: -15%; bottom: 4%; width: 52%; max-width: 260px; opacity: .26; transform: rotate(-5deg); }
    .ribbon { position: absolute; z-index: 2; top: 26%; left: -11%; width: 122%; transform: rotate(-8deg); filter: drop-shadow(0 16px 16px #584b3f1c); }
    .copy { position: relative; z-index: 3; display: grid; place-items: center; min-height: 780px; padding: 48px 32px; text-align: center; }
    .eyebrow { margin: 0 0 22px; color: #806e59; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; }
    h1 { max-width: 8ch; margin: 0; font-family: Georgia, serif; font-size: clamp(54px, 16vw, 78px); font-weight: 400; letter-spacing: -.06em; line-height: .84; }
    .date { margin: 24px 0 0; color: #584b3f; font-size: 12px; letter-spacing: .2em; }
    .cta { margin-top: 34px; padding: 13px 24px; border: 1px solid #9a8058; border-radius: 999px; background: #f5efe4cc; color: #584b3f; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .note { position: absolute; z-index: 4; left: 50%; bottom: 34px; transform: translateX(-50%); color: #806e59; font-size: 10px; letter-spacing: .12em; white-space: nowrap; }
  </style>
</head>
<body>
  <main class="stage" aria-label="Preview opening Nắng Trên Lụa">
    <div class="sun" aria-hidden="true"></div>
    <img class="flowers" src="../../../../public/assets/images/templates/sunlit-silk/artwork/ss-modern-floral-cluster-v1-optimized.png" alt="">
    <img class="sculpture" src="../../../../public/assets/images/templates/sunlit-silk/artwork/ss-modern-floral-sculpture-v1-optimized.png" alt="">
    <img class="envelope" src="../../../../public/assets/images/templates/sunlit-silk/artwork/ss-linen-envelope-v1-optimized.png" alt="">
    <img class="ribbon" src="../../../../public/assets/images/templates/sunlit-silk/artwork/ss-ribbon-clasp-v2-optimized.png" alt="">
    <div class="copy">
      <div>
        <p class="eyebrow">Trân trọng gửi lời mời</p>
        <h1>Minh An<br><small style="font-size:.34em; letter-spacing:.05em">&amp;</small><br>Thu Hà</h1>
        <p class="date">16 · 01 · 2027</p>
        <div class="cta">Chạm để mở thiệp</div>
      </div>
    </div>
    <p class="note">NẮNG TRÊN LỤA · OPENING ARTWORK V2</p>
  </main>
</body>
</html>
