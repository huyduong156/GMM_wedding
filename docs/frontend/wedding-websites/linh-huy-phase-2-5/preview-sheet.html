<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linh & Huy — Decor preview</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 40px; background: #e8e7e1; color: #252522; font: 14px/1.5 Arial, sans-serif; }
      main { max-width: 1180px; margin: 0 auto; }
      h1 { margin: 0 0 8px; font: 32px/1.1 Georgia, serif; font-weight: 400; }
      .lede { margin: 0 0 30px; color: #6c6b65; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
      figure { margin: 0; padding: 12px; background: #f5f4ef; }
      img { display: block; width: 100%; object-fit: contain; }
      figcaption { padding: 10px 2px 1px; color: #64635d; font-size: 11px; }
      .plate { aspect-ratio: 3 / 2; object-fit: cover; }
      .curves { aspect-ratio: 8 / 5; background: #fbfaf6; }
      .joined { height: 180px; background: #fbfaf6; }
      .frame-wrap { display: grid; place-items: center; min-height: 300px; background: #ecebe5; }
      .photo { position: relative; width: 210px; height: 250px; background: #d9d8d0; }
      .photo img { position: absolute; inset: 0; height: 100%; }
      .mobile { height: 300px; background: #fbfaf6; }
      .cutout { height: 300px; padding: 18px; object-fit: contain; background: #f9f8f3; }
      @media (max-width: 680px) { body { padding: 20px; } .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Decor artwork · review sheet</h1>
      <p class="lede">Nét mực đen trên nền giấy ngà — các tài sản chỉ để duyệt, chưa gắn vào landing page.</p>
      <div class="grid">
        <figure><img class="plate" src="../../../../frontend/public/assets/images/templates/forever/decor/background-two-curved-black-lines-v1.webp" alt="Hai đường cong mực đen trên nền giấy ngà" /><figcaption>WebP runtime candidate · background plate · 1536 × 1024 · 18,718 bytes</figcaption></figure>
        <figure><img class="curves" src="../../../../frontend/public/assets/images/templates/forever/decor/background-two-black-curves.svg" alt="Hai đường cong mực đen, SVG desktop" /><figcaption>SVG · transparent desktop background curves</figcaption></figure>
        <figure><img class="mobile" src="../../../../frontend/public/assets/images/templates/forever/decor/background-two-black-curves-mobile.svg" alt="Hai đường cong dọc cho background mobile" /><figcaption>SVG · transparent mobile background curves</figcaption></figure>
        <figure><img class="joined" src="../../../../frontend/public/assets/images/templates/forever/decor/joined-path-accent.svg" alt="Hai nét mực gặp nhau thành một đường" /><figcaption>SVG · joined-path section accent</figcaption></figure>
        <figure><div class="frame-wrap"><div class="photo"><img src="../../../../frontend/public/assets/images/templates/forever/decor/photo-frame-open-corners.svg" alt="" /></div></div><figcaption>SVG · open-corner photo frame (edge-dependent)</figcaption></figure>
        <figure><img class="cutout" src="../../../../frontend/public/assets/images/templates/forever/decor/detail-vows-booklet.webp" alt="Sổ lời thề gấp bằng giấy ngà, không chữ" /><figcaption>WebP · folded vows booklet · 143,240 bytes</figcaption></figure>
        <figure><img class="cutout" src="../../../../frontend/public/assets/images/templates/forever/decor/detail-brushed-silver-bands.webp" alt="Hai nhẫn bạc xước đơn giản, không đính đá" /><figcaption>WebP · pair of brushed-silver bands · 88,600 bytes</figcaption></figure>
        <figure><img class="cutout" src="../../../../frontend/public/assets/images/templates/forever/decor/detail-black-silk-ribbon-pen.webp" alt="Dải lụa đen cạnh bút máy đen mảnh" /><figcaption>WebP · black silk ribbon and slim pen · 83,392 bytes</figcaption></figure>
      </div>
    </main>
  </body>
</html>
